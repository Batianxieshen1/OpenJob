<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1750" viewBox="0 0 1800 1750" role="img" aria-labelledby="title desc">
<title id="title">OpenJob refined logo directions</title><desc id="desc">Eight refinements for the four preferred OpenJob directions: flight, fold, north star and open tabs.</desc>
<defs>
<linearGradient id="flightA" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1265F6"/><stop offset=".5" stop-color="#7356E7"/><stop offset="1" stop-color="#F57E9C"/></linearGradient>
<linearGradient id="flightB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00A9B5"/><stop offset=".5" stop-color="#497CF6"/><stop offset="1" stop-color="#A658E6"/></linearGradient>
<linearGradient id="foldA" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#5339D7"/><stop offset=".52" stop-color="#AA52DF"/><stop offset="1" stop-color="#FFA967"/></linearGradient>
<linearGradient id="foldB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#126EFC"/><stop offset=".48" stop-color="#00C2B3"/><stop offset="1" stop-color="#F29476"/></linearGradient>
<linearGradient id="starA" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#173FAB"/><stop offset=".52" stop-color="#6677EF"/><stop offset="1" stop-color="#F38BA5"/></linearGradient>
<linearGradient id="starB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0677C"/><stop offset=".5" stop-color="#C14DCE"/><stop offset="1" stop-color="#5E69F7"/></linearGradient>
<linearGradient id="tabsA" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00A99B"/><stop offset=".5" stop-color="#368AF5"/><stop offset="1" stop-color="#F8B052"/></linearGradient>
<linearGradient id="tabsB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2856ED"/><stop offset=".52" stop-color="#8B5DE8"/><stop offset="1" stop-color="#F57D9B"/></linearGradient>
<filter id="sh" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#17233E" flood-opacity=".14"/></filter>
<style>.h{font-family:Arial,sans-serif;font-size:27px;font-weight:800;letter-spacing:2px;fill:#64748B}.i{font-family:Arial,sans-serif;font-size:22px;fill:#94A3B8}.n{font-family:Arial,sans-serif;font-size:21px;font-weight:800;letter-spacing:1px;fill:#94A3B8}.k{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#25324A}.d{font-family:Arial,sans-serif;font-size:17px;fill:#94A3B8}.sans{font-family:Arial,sans-serif;font-size:82px;font-weight:750;letter-spacing:-4px;fill:#101828}.soft{font-family:Arial,sans-serif;font-size:82px;font-weight:500;letter-spacing:-5px;fill:#101828}.serif{font-family:Georgia,serif;font-size:86px;font-weight:700;letter-spacing:-5px;fill:#101828}.mono{font-family:'Courier New',monospace;font-size:71px;font-weight:700;letter-spacing:-5px;fill:#101828}.tiny{font-family:Arial,sans-serif;font-size:15px;font-weight:700;letter-spacing:1.3px;fill:#CBD5E1}.pill{font-family:Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:1.2px;fill:#59708F}</style>
</defs>
<rect width="1800" height="1750" fill="#F5F7FB"/><text x="90" y="68" class="h">OPENJOB · PREFERRED DIRECTIONS REFINED</text><text x="90" y="108" class="i">仅围绕你选中的 1、3、5、7 继续收敛：每个方向 2 个版本，图标与 OpenJob 的比例已统一。</text>

<!-- 01 flight / folded -->
<g transform="translate(70 150)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">01A</text><text x="92" y="48" class="k">FLIGHT · FOLDED</text><text x="38" y="76" class="d">纸飞机更像一个高级的折纸标记，轮廓更干净</text><g transform="translate(101 108)scale(.38)" filter="url(#sh)"><path d="M28 188 374 33Q393 26 389 50L247 340Q242 352 224 338L176 220 39 205Q17 195 28 188Z" fill="url(#flightA)"/><path d="M28 188 176 220 389 50M176 220 224 338 247 340 244 211" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" opacity=".94"/><path d="M176 220 244 211" stroke="#fff" stroke-width="17" stroke-linecap="round" opacity=".65"/><circle cx="176" cy="220" r="13" fill="#FFD176"/></g><text x="330" y="218" class="sans">OpenJob</text><text x="687" y="111" class="pill">FLIGHT</text><text x="700" y="298" class="tiny">01A / 08</text></g>

<!-- 02 flight / open tail -->
<g transform="translate(930 150)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">01B</text><text x="92" y="48" class="k">FLIGHT · OPEN TAIL</text><text x="38" y="76" class="d">保留飞行感，用开放尾部留下“Open”的记忆点</text><g transform="translate(103 107)scale(.38)" filter="url(#sh)"><path d="M38 189 350 51Q371 42 364 66L264 293Q257 311 242 294L195 238 58 223Q25 218 38 189Z" fill="url(#flightB)"/><path d="M38 189 195 238 364 66M195 238 242 294 264 293 245 212" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><path d="M264 293 C300 310 333 295 344 264" fill="none" stroke="url(#flightB)" stroke-width="27" stroke-linecap="round"/><circle cx="195" cy="238" r="13" fill="#FFD176"/></g><text x="330" y="218" class="serif">OpenJob</text><text x="687" y="111" class="pill">FLIGHT</text><text x="700" y="298" class="tiny">01B / 08</text></g>

<!-- 03 fold / open page -->
<g transform="translate(70 530)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">03A</text><text x="92" y="48" class="k">FOLD · OPEN PAGE</text><text x="38" y="76" class="d">把折页拆成更克制的两面，像一扇打开的新页面</text><g transform="translate(108 105)scale(.39)" filter="url(#sh)"><path d="M47 72 202 30V322L47 278Z" fill="url(#foldA)"/><path d="M357 72 202 30V322L357 278Z" fill="url(#foldA)"/><path d="M47 72 202 131 357 72M202 131V322" fill="none" stroke="#fff" stroke-width="17" stroke-linejoin="round" opacity=".87"/><circle cx="202" cy="131" r="14" fill="#FFD27A"/></g><text x="330" y="218" class="soft">OpenJob</text><text x="687" y="111" class="pill">FOLD</text><text x="700" y="298" class="tiny">03A / 08</text></g>

<!-- 04 fold / corner -->
<g transform="translate(930 530)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">03B</text><text x="92" y="48" class="k">FOLD · OPEN CORNER</text><text x="38" y="76" class="d">用翻开的右上角表达“打开”，更接近 App 品牌图标</text><g transform="translate(106 106)scale(.38)" filter="url(#sh)"><path d="M67 39H273L350 116V295Q350 323 322 323H67Q39 323 39 295V67Q39 39 67 39Z" fill="url(#foldB)"/><path d="M273 39V116H350" fill="none" stroke="#fff" stroke-width="24" stroke-linejoin="round" opacity=".92"/><path d="M106 173H271M106 223H222" stroke="#fff" stroke-width="19" stroke-linecap="round" opacity=".75"/><circle cx="271" cy="173" r="13" fill="#FFD175"/></g><text x="330" y="218" class="sans">OpenJob</text><text x="687" y="111" class="pill">FOLD</text><text x="700" y="298" class="tiny">03B / 08</text></g>

<!-- 05 star / north -->
<g transform="translate(70 910)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">05A</text><text x="92" y="48" class="k">NORTH · SOFT STAR</text><text x="38" y="76" class="d">将星形收成柔和的四向光，成熟而不幼稚</text><g transform="translate(106 104)scale(.39)" filter="url(#sh)"><path d="M200 24C222 101 270 149 347 171 270 193 222 241 200 318 178 241 130 193 53 171 130 149 178 101 200 24Z" fill="url(#starA)"/><path d="M200 78V264M107 171H293" stroke="#fff" stroke-width="17" stroke-linecap="round" opacity=".78"/><circle cx="200" cy="171" r="19" fill="#FFD277"/></g><text x="330" y="218" class="serif">OpenJob</text><text x="687" y="111" class="pill">NORTH</text><text x="700" y="298" class="tiny">05A / 08</text></g>

<!-- 06 star / beacon -->
<g transform="translate(930 910)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">05B</text><text x="92" y="48" class="k">NORTH · BEACON</text><text x="38" y="76" class="d">星光嵌入圆角菱形，更紧凑、更适合作为头像图标</text><g transform="translate(106 106)scale(.38)" filter="url(#sh)"><path d="M201 28 351 171 201 314 51 171Z" fill="url(#starB)"/><path d="M201 80 227 145 292 171 227 197 201 262 175 197 110 171 175 145Z" fill="#fff"/><circle cx="201" cy="171" r="13" fill="#FFD277"/></g><text x="330" y="218" class="sans">OpenJob</text><text x="687" y="111" class="pill">NORTH</text><text x="700" y="298" class="tiny">05B / 08</text></g>

<!-- 07 tabs / stacked -->
<g transform="translate(70 1290)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">07A</text><text x="92" y="48" class="k">TABS · STACKED</text><text x="38" y="76" class="d">双层页签更有产品属性，也能表达筛选和整理</text><g transform="translate(107 106)scale(.38)" filter="url(#sh)"><rect x="53" y="104" width="222" height="205" rx="33" fill="none" stroke="url(#tabsA)" stroke-width="34"/><rect x="126" y="45" width="222" height="205" rx="33" fill="#fff" stroke="url(#tabsA)" stroke-width="34"/><path d="M169 116H300M169 163H252" stroke="url(#tabsA)" stroke-width="22" stroke-linecap="round"/><circle cx="300" cy="116" r="12" fill="#FFCF73"/></g><text x="330" y="218" class="mono">OpenJob</text><text x="687" y="111" class="pill">TABS</text><text x="700" y="298" class="tiny">07A / 08</text></g>

<!-- 08 tabs / open O -->
<g transform="translate(930 1290)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">07B</text><text x="92" y="48" class="k">TABS · OPEN O</text><text x="38" y="76" class="d">用圆角页签围出一个 O，产品与品牌记忆点合并</text><g transform="translate(104 104)scale(.39)" filter="url(#sh)"><path d="M80 72H250Q281 72 281 103V154" fill="none" stroke="url(#tabsB)" stroke-width="44" stroke-linecap="round"/><path d="M319 187V251Q319 282 288 282H118Q79 282 79 243V176" fill="none" stroke="url(#tabsB)" stroke-width="44" stroke-linecap="round"/><path d="M142 117H254Q279 117 279 142V189" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" opacity=".82"/><circle cx="199" cy="178" r="16" fill="#FFD177"/></g><text x="330" y="218" class="soft">OpenJob</text><text x="687" y="111" class="pill">TABS</text><text x="700" y="298" class="tiny">07B / 08</text></g>

<text x="90" y="1715" class="i">下一步你可以直接告诉我：哪一个最像 OpenJob（例如“01A 和 03B”）。我会把最好的 1–2 个制作成可直接用于网站、GitHub 和宣传的正式图标套件。</text>
</svg>
