name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e . ruff pytest

      - name: Verify CLI entry point
        run: openjob --help

      - name: Verify version output
        run: openjob --version

      - name: Run import check
        run: python -c "import openjob; print(openjob.__version__)"

      - name: Lint with ruff
        # Existing code has broader style debt. Keep a non-bypassable gate for
        # syntax and undefined-name errors while that debt is retired separately.
        run: ruff check src/ --select=E9,F63,F7,F82

      - name: Run Python test suite
        run: python -m pytest -q

  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/openjob/web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/openjob/web/frontend
        run: npm ci

      - name: Build frontend
        working-directory: src/openjob/web/frontend
        run: npm run build

  ui-acceptance:
    needs: frontend-quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/openjob/web/frontend/package-lock.json

      - name: Install OpenJob and frontend dependencies
        run: |
          pip install -e .
          cd src/openjob/web/frontend
          npm ci

      - name: Build frontend served by the workbench
        working-directory: src/openjob/web/frontend
        run: npm run build

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start local workbench
        run: |
          openjob web --no-open > openjob-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8686/api/workbench > /dev/null; then exit 0; fi
            sleep 1
          done
          cat openjob-web.log
          exit 1

      - name: Run UI acceptance
        working-directory: src/openjob/web/frontend
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          OPENJOB_UI_BASE_URL: http://127.0.0.1:8686
          OPENJOB_UI_SCREENSHOT_DIR: ${{ github.workspace }}/ui-acceptance-screenshots
        run: node scripts/ui-acceptance.cjs

      - name: Upload UI acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-acceptance-screenshots
          path: ui-acceptance-screenshots
          if-no-files-found: ignore
