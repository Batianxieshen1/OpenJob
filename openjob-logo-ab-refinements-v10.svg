<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400" role="img" aria-labelledby="title desc">
<title id="title">OpenJob Flight and Fold refinements</title><desc id="desc">Six refinements of the selected Flight and Open Fold logo directions, including icon and wordmark improvements.</desc>
<defs>
<linearGradient id="fa" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1467F8"/><stop offset=".5" stop-color="#7257E8"/><stop offset="1" stop-color="#F47E9C"/></linearGradient>
<linearGradient id="fb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00ABB8"/><stop offset=".5" stop-color="#497DF6"/><stop offset="1" stop-color="#A45BE5"/></linearGradient>
<linearGradient id="fc" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#2B55EE"/><stop offset=".5" stop-color="#805DE6"/><stop offset="1" stop-color="#F47B9D"/></linearGradient>
<linearGradient id="ba" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#5138D7"/><stop offset=".52" stop-color="#AB52DE"/><stop offset="1" stop-color="#FFAA67"/></linearGradient>
<linearGradient id="bb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1370FC"/><stop offset=".5" stop-color="#00C1B3"/><stop offset="1" stop-color="#F29476"/></linearGradient>
<linearGradient id="bc" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#5B35D8"/><stop offset=".48" stop-color="#B552E0"/><stop offset="1" stop-color="#FFA968"/></linearGradient>
<filter id="sh" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#17233E" flood-opacity=".14"/></filter>
<style>.h{font-family:Arial,sans-serif;font-size:27px;font-weight:800;letter-spacing:2px;fill:#64748B}.i{font-family:Arial,sans-serif;font-size:22px;fill:#94A3B8}.num{font-family:Arial,sans-serif;font-size:21px;font-weight:800;letter-spacing:1px;fill:#94A3B8}.name{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#25324A}.note{font-family:Arial,sans-serif;font-size:17px;fill:#94A3B8}.sans{font-family:Arial,sans-serif;font-size:84px;font-weight:750;letter-spacing:-4.5px;fill:#101828}.geometric{font-family:Arial,sans-serif;font-size:82px;font-weight:700;letter-spacing:-5px;fill:#101828}.serif{font-family:Georgia,serif;font-size:88px;font-weight:700;letter-spacing:-5px;fill:#101828}.humanist{font-family:Arial,sans-serif;font-size:83px;font-weight:500;letter-spacing:-5px;fill:#101828}.caps{font-family:Arial,sans-serif;font-size:63px;font-weight:800;letter-spacing:1px;fill:#101828}.tiny{font-family:Arial,sans-serif;font-size:15px;font-weight:700;letter-spacing:1.3px;fill:#CBD5E1}</style>
</defs>
<rect width="1800" height="1400" fill="#F5F7FB"/><text x="90" y="68" class="h">OPENJOB · A / B REFINEMENTS</text><text x="90" y="108" class="i">只围绕 A 纸飞机与 B 折页精修：每个方向分别尝试图标形态、线条和更适配的 OpenJob 字标。</text>

<!-- A1 -->
<g transform="translate(70 150)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="num">A1</text><text x="84" y="48" class="name">FLIGHT · SIGNATURE</text><text x="38" y="76" class="note">保留折面细节，但将外轮廓收得更像专属品牌签名</text><g transform="translate(104 108)scale(.39)" filter="url(#sh)"><path d="M28 188 374 33Q393 26 389 50L247 340Q242 352 224 338L176 220 39 205Q17 195 28 188Z" fill="url(#fa)"/><path d="M28 188 176 220 389 50M176 220 224 338 247 340 244 211" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" opacity=".94"/><circle cx="176" cy="220" r="12" fill="#FFD176"/></g><text x="330" y="218" class="sans">OpenJob</text><text x="700" y="298" class="tiny">A1 / 06</text></g>

<!-- A2 -->
<g transform="translate(930 150)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="num">A2</text><text x="84" y="48" class="name">FLIGHT · SOFT WING</text><text x="38" y="76" class="note">将尖锐感变柔，图形更友好，更符合“助手”产品气质</text><g transform="translate(105 108)scale(.39)" filter="url(#sh)"><path d="M42 191Q39 169 61 159L335 44Q367 31 350 64L246 302Q236 322 218 299L179 245 64 223Q45 219 42 191Z" fill="url(#fb)"/><path d="M42 191 179 245 350 64M179 245 218 299 246 302 237 213" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><path d="M226 216Q268 230 294 207" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" opacity=".55"/><circle cx="179" cy="245" r="12" fill="#FFD276"/></g><text x="330" y="218" class="humanist">OpenJob</text><text x="700" y="298" class="tiny">A2 / 06</text></g>

<!-- A3 -->
<g transform="translate(70 530)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="num">A3</text><text x="84" y="48" class="name">FLIGHT · WORDMARK</text><text x="38" y="76" class="note">更纯粹的飞机图标，配合收紧字距的现代字标</text><g transform="translate(108 111)scale(.39)" filter="url(#sh)"><path d="M33 187 366 42Q388 33 378 60L247 316Q238 337 218 311L174 253 56 222Q24 214 33 187Z" fill="url(#fc)"/><path d="M33 187 174 253 378 60M174 253 218 311 247 316" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></g><text x="330" y="218" class="geometric">OpenJob</text><path d="M610 231H655" stroke="url(#fc)" stroke-width="10" stroke-linecap="round"/><text x="700" y="298" class="tiny">A3 / 06</text></g>

<!-- B1 -->
<g transform="translate(930 530)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="num">B1</text><text x="84" y="48" class="name">FOLD · OPEN PAGE</text><text x="38" y="76" class="note">保留最初的双页结构，统一折线与边缘，提升高级感</text><g transform="translate(105 104)scale(.41)" filter="url(#sh)"><path d="M47 72 202 30V322L47 278Z" fill="url(#ba)"/><path d="M357 72 202 30V322L357 278Z" fill="url(#ba)"/><path d="M47 72 202 131 357 72M202 131V322" fill="none" stroke="#fff" stroke-width="17" stroke-linejoin="round" opacity=".88"/><circle cx="202" cy="131" r="13" fill="#FFD27A"/></g><text x="330" y="218" class="humanist">OpenJob</text><text x="700" y="298" class="tiny">B1 / 06</text></g>

<!-- B2 -->
<g transform="translate(70 910)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="num">B2</text><text x="84" y="48" class="name">FOLD · PORTAL</text><text x="38" y="76" class="note">折页中间留出一道光，视觉上更像一扇打开的机会之门</text><g transform="translate(106 106)scale(.40)" filter="url(#sh)"><path d="M54 75 193 28V326L54 279Z" fill="url(#bb)"/><path d="M346 75 207 28V326L346 279Z" fill="url(#bb)"/><path d="M54 75 193 137M346 75 207 137" fill="none" stroke="#fff" stroke-width="18" stroke-linejoin="round" opacity=".86"/><path d="M193 137V326M207 137V326" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" opacity=".65"/><circle cx="200" cy="141" r="14" fill="#FFD177"/></g><text x="330" y="218" class="serif">OpenJob</text><text x="700" y="298" class="tiny">B2 / 06</text></g>

<!-- B3 -->
<g transform="translate(930 910)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="num">B3</text><text x="84" y="48" class="name">FOLD · O MONOGRAM</text><text x="38" y="76" class="note">将折页收进圆形 O 的轮廓，品牌化最强、缩小也更稳定</text><g transform="translate(104 106)scale(.40)" filter="url(#sh)"><circle cx="200" cy="171" r="145" fill="url(#bc)"/><path d="M86 91 200 52V290L86 251ZM314 91 200 52V290L314 251Z" fill="#fff"/><path d="M86 91 200 140 314 91M200 140V290" fill="none" stroke="url(#bc)" stroke-width="17" stroke-linejoin="round"/><circle cx="200" cy="140" r="13" fill="#FFD177"/></g><text x="330" y="218" class="caps">OpenJob</text><text x="700" y="298" class="tiny">B3 / 06</text></g>
<text x="90" y="1365" class="i">建议你先从“图标是否像 OpenJob”来选，而不是只看图形好不好看：A 更主动、轻快；B 更专业、可信赖。选出最接近的 1–2 个后，我会再统一细节并输出成品。</text>
</svg>
