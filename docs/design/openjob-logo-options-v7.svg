<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2100" viewBox="0 0 1800 2100" role="img" aria-labelledby="title desc">
<title id="title">OpenJob Logo Concepts V7</title><desc id="desc">Refined paper plane and nine all-new balanced logo directions for OpenJob.</desc>
<defs>
<linearGradient id="p" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1469FF"/><stop offset=".5" stop-color="#7558E9"/><stop offset="1" stop-color="#F37F9A"/></linearGradient>
<linearGradient id="q" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1C7CFF"/><stop offset=".5" stop-color="#00BFB5"/><stop offset="1" stop-color="#F29A6E"/></linearGradient>
<linearGradient id="r" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#4B37D7"/><stop offset=".5" stop-color="#A750E3"/><stop offset="1" stop-color="#FFA660"/></linearGradient>
<linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00A8A1"/><stop offset=".5" stop-color="#377EF2"/><stop offset="1" stop-color="#9A60E8"/></linearGradient>
<linearGradient id="t" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#173FAD"/><stop offset=".52" stop-color="#5F72ED"/><stop offset="1" stop-color="#F188A7"/></linearGradient>
<linearGradient id="u" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EF626E"/><stop offset=".48" stop-color="#CF50C4"/><stop offset="1" stop-color="#596AFA"/></linearGradient>
<linearGradient id="v" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00A89D"/><stop offset=".48" stop-color="#338AF5"/><stop offset="1" stop-color="#FBB053"/></linearGradient>
<linearGradient id="w" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2A55ED"/><stop offset=".52" stop-color="#8E59E7"/><stop offset="1" stop-color="#F47B9D"/></linearGradient>
<linearGradient id="x" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00AFC2"/><stop offset=".46" stop-color="#547CF5"/><stop offset="1" stop-color="#D95DDD"/></linearGradient>
<linearGradient id="y" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F17872"/><stop offset=".44" stop-color="#E855B5"/><stop offset="1" stop-color="#6A5EF5"/></linearGradient>
<filter id="sh" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#17233E" flood-opacity=".14"/></filter>
<style>.h{font-family:Arial,sans-serif;font-size:27px;font-weight:800;letter-spacing:2px;fill:#64748B}.i{font-family:Arial,sans-serif;font-size:22px;fill:#94A3B8}.n{font-family:Arial,sans-serif;font-size:21px;font-weight:800;letter-spacing:1px;fill:#94A3B8}.k{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#25324A}.d{font-family:Arial,sans-serif;font-size:17px;fill:#94A3B8}.sans{font-family:Arial,sans-serif;font-size:82px;font-weight:750;letter-spacing:-4px;fill:#101828}.soft{font-family:Arial,sans-serif;font-size:82px;font-weight:500;letter-spacing:-5px;fill:#101828}.serif{font-family:Georgia,serif;font-size:86px;font-weight:700;letter-spacing:-5px;fill:#101828}.mono{font-family:'Courier New',monospace;font-size:71px;font-weight:700;letter-spacing:-5px;fill:#101828}.wide{font-family:Arial,sans-serif;font-size:73px;font-weight:700;letter-spacing:1px;fill:#101828}.tiny{font-family:Arial,sans-serif;font-size:15px;font-weight:700;letter-spacing:1.3px;fill:#CBD5E1}</style>
</defs>
<rect width="1800" height="2100" fill="#F5F7FB"/><text x="90" y="68" class="h">OPENJOB · FLIGHT MARK REFINED</text><text x="90" y="108" class="i">01 是纸飞机方向的精修版；02–10 均为新的替换方向，统一以适合正式横版 Logo 的比例呈现。</text>
<!-- 01 -->
<g transform="translate(70 150)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">01</text><text x="82" y="48" class="k">FLIGHT MARK · REFINED</text><text x="38" y="76" class="d">保留纸飞机，但变得更利落、更具品牌感</text><g transform="translate(101 108)scale(.38)" filter="url(#sh)"><path d="M27 188L372 31Q395 25 390 50L248 341Q243 352 224 339L177 219 39 205Q17 194 27 188Z" fill="url(#p)"/><path d="M27 188 177 219 390 50M177 219 224 339 248 341 244 209" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/><circle cx="177" cy="219" r="15" fill="#FFD277"/></g><text x="330" y="218" class="sans">OpenJob</text><text x="700" y="298" class="tiny">01 / 10</text></g>
<!-- 02 -->
<g transform="translate(930 150)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">02</text><text x="82" y="48" class="k">CAREER LADDER</text><text x="38" y="76" class="d">抽象阶梯向上延伸，表达职业成长</text><g transform="translate(105 112)scale(.37)" filter="url(#sh)"><path d="M46 290H138V200H230V110H322M322 110H390V178" fill="none" stroke="url(#q)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="290" r="16" fill="#FFD073"/><circle cx="322" cy="110" r="16" fill="#fff"/></g><text x="330" y="218" class="serif">OpenJob</text><text x="700" y="298" class="tiny">02 / 10</text></g>
<!-- 03 -->
<g transform="translate(70 530)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">03</text><text x="82" y="48" class="k">OPEN FOLD</text><text x="38" y="76" class="d">像一页纸展开，代表新的机会与可能</text><g transform="translate(107 108)scale(.37)" filter="url(#sh)"><path d="M61 82 201 32 341 82V292L201 342 61 292Z" fill="url(#r)"/><path d="M61 82 201 153 341 82M201 153V342M112 118 201 164 290 118" fill="none" stroke="#fff" stroke-width="20" stroke-linejoin="round" opacity=".9"/><circle cx="201" cy="153" r="14" fill="#FFD27A"/></g><text x="330" y="218" class="soft">OpenJob</text><text x="700" y="298" class="tiny">03 / 10</text></g>
<!-- 04 -->
<g transform="translate(930 530)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">04</text><text x="82" y="48" class="k">OPPORTUNITY PULSE</text><text x="38" y="76" class="d">节奏线：发现、匹配、行动</text><g transform="translate(104 111)scale(.37)" filter="url(#sh)"><path d="M35 201H111L152 111 211 286 266 157 300 201H380" fill="none" stroke="url(#s)" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/><circle cx="152" cy="111" r="17" fill="#FFD277"/><circle cx="266" cy="157" r="15" fill="#fff"/></g><text x="330" y="218" class="sans">OpenJob</text><text x="700" y="298" class="tiny">04 / 10</text></g>
<!-- 05 -->
<g transform="translate(70 910)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">05</text><text x="82" y="48" class="k">NORTH STAR</text><text x="38" y="76" class="d">职业选择中的方向感：清晰、坚定</text><g transform="translate(105 106)scale(.37)" filter="url(#sh)"><path d="M202 27 244 130 350 171 244 214 202 318 160 214 54 171 160 130Z" fill="url(#t)"/><path d="M202 74V268M105 171H299" stroke="#fff" stroke-width="17" stroke-linecap="round" opacity=".78"/><circle cx="202" cy="171" r="19" fill="#FFD277"/></g><text x="330" y="218" class="serif">OpenJob</text><text x="700" y="298" class="tiny">05 / 10</text></g>
<!-- 06 -->
<g transform="translate(930 910)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">06</text><text x="82" y="48" class="k">MEETING POINT</text><text x="38" y="76" class="d">两条路径自然相遇，隐喻人与岗位的匹配</text><g transform="translate(104 107)scale(.37)" filter="url(#sh)"><path d="M54 72C103 72 136 115 174 171 211 225 250 269 344 269M344 72C295 72 262 115 224 171 187 225 148 269 54 269" fill="none" stroke="url(#u)" stroke-width="48" stroke-linecap="round"/><circle cx="199" cy="171" r="25" fill="#fff"/><circle cx="199" cy="171" r="12" fill="#FFD175"/></g><text x="330" y="218" class="soft">OpenJob</text><text x="700" y="298" class="tiny">06 / 10</text></g>
<!-- 07 -->
<g transform="translate(70 1290)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">07</text><text x="82" y="48" class="k">OPEN TABS</text><text x="38" y="76" class="d">信息被逐页打开，适合岗位探索的产品感</text><g transform="translate(106 107)scale(.37)" filter="url(#sh)"><rect x="64" y="94" width="210" height="210" rx="34" fill="none" stroke="url(#v)" stroke-width="35"/><rect x="131" y="46" width="210" height="210" rx="34" fill="#fff" stroke="url(#v)" stroke-width="35"/><path d="M175 118H296M175 165H260" stroke="url(#v)" stroke-width="24" stroke-linecap="round"/><circle cx="296" cy="118" r="13" fill="#FFCD72"/></g><text x="330" y="218" class="mono">OpenJob</text><text x="700" y="298" class="tiny">07 / 10</text></g>
<!-- 08 -->
<g transform="translate(930 1290)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">08</text><text x="82" y="48" class="k">LIFT</text><text x="38" y="76" class="d">两条弧线向上托起一个点，轻快有上升感</text><g transform="translate(105 108)scale(.37)" filter="url(#sh)"><path d="M63 269C77 143 155 74 197 74 239 74 317 143 331 269M124 267C136 192 168 153 197 153 226 153 258 192 270 267" fill="none" stroke="url(#w)" stroke-width="51" stroke-linecap="round"/><circle cx="197" cy="74" r="20" fill="#FFD174"/></g><text x="330" y="218" class="wide">OpenJob</text><text x="700" y="298" class="tiny">08 / 10</text></g>
<!-- 09 -->
<g transform="translate(70 1670)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">09</text><text x="82" y="48" class="k">POSSIBILITY FIELD</text><text x="38" y="76" class="d">多个节点构成可能性场域，代表更广的选择</text><g transform="translate(103 107)scale(.37)" filter="url(#sh)"><path d="M62 263 137 171 213 263 287 171 365 263M62 80 137 171 213 80 287 171 365 80" fill="none" stroke="url(#x)" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"/><circle cx="213" cy="171" r="25" fill="#fff"/><circle cx="213" cy="171" r="12" fill="#FFCC73"/></g><text x="330" y="218" class="sans">OpenJob</text><text x="700" y="298" class="tiny">09 / 10</text></g>
<!-- 10 -->
<g transform="translate(930 1670)"><rect width="800" height="350" rx="30" fill="#fff"/><text x="38" y="48" class="n">10</text><text x="82" y="48" class="k">KEYHOLE O</text><text x="38" y="76" class="d">从一个 O 里看见通路，适合长期品牌化</text><g transform="translate(104 106)scale(.37)" filter="url(#sh)"><circle cx="200" cy="170" r="138" fill="url(#y)"/><circle cx="200" cy="135" r="47" fill="#fff"/><path d="M164 164H236L262 302H138Z" fill="#fff"/><circle cx="200" cy="135" r="14" fill="#FFD174"/></g><text x="330" y="218" class="serif">OpenJob</text><text x="700" y="298" class="tiny">10 / 10</text></g>
<text x="90" y="2070" class="i">如果纸飞机方向确定，我下一轮可以只围绕它制作极简、圆角、App 图标、深色背景等精修版本。</text>
</svg>
