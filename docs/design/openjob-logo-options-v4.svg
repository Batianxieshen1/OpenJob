<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3020" viewBox="0 0 1800 3020" role="img" aria-labelledby="title desc">
  <title id="title">OpenJob logo exploration — 10 concepts</title>
  <desc id="desc">Ten independent OpenJob logo and wordmark directions, prepared as a visual selection board.</desc>
  <defs>
    <linearGradient id="gA" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1769FF"/><stop offset=".48" stop-color="#7658E8"/><stop offset="1" stop-color="#FF7E9D"/></linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00A8B5"/><stop offset=".5" stop-color="#4A7CFF"/><stop offset="1" stop-color="#B45AE5"/></linearGradient>
    <linearGradient id="gC" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#2B4BD9"/><stop offset=".46" stop-color="#7B68E9"/><stop offset=".78" stop-color="#EC78B0"/><stop offset="1" stop-color="#FFC16B"/></linearGradient>
    <linearGradient id="gD" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1E7CFF"/><stop offset=".42" stop-color="#00C5B8"/><stop offset="1" stop-color="#F08A83"/></linearGradient>
    <linearGradient id="gE" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#5A36D6"/><stop offset=".52" stop-color="#D54FD9"/><stop offset="1" stop-color="#FF9E68"/></linearGradient>
    <linearGradient id="gF" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3856F5"/><stop offset=".5" stop-color="#13BFD4"/><stop offset="1" stop-color="#80D88E"/></linearGradient>
    <linearGradient id="gG" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#164EAD"/><stop offset=".55" stop-color="#5D77F4"/><stop offset="1" stop-color="#F58BA4"/></linearGradient>
    <linearGradient id="gH" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F45C83"/><stop offset=".5" stop-color="#A553E5"/><stop offset="1" stop-color="#3E89FF"/></linearGradient>
    <linearGradient id="gI" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00A7A0"/><stop offset=".5" stop-color="#1E8CFF"/><stop offset="1" stop-color="#F5A24A"/></linearGradient>
    <linearGradient id="gJ" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF7D6E"/><stop offset=".45" stop-color="#E456B8"/><stop offset="1" stop-color="#6D5CF6"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1F2A44" flood-opacity=".14"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="170%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: 2px; fill: #64748B; }
      .intro { font-family: Arial, sans-serif; font-size: 23px; fill: #94A3B8; }
      .num { font-family: Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 1px; fill: #94A3B8; }
      .name { font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #25324A; }
      .note { font-family: Arial, sans-serif; font-size: 18px; fill: #94A3B8; }
      .wordSans { font-family: Arial, Helvetica, sans-serif; font-size: 92px; font-weight: 750; letter-spacing: -4px; fill: #111827; }
      .wordSerif { font-family: Georgia, Baskerville, 'Times New Roman', serif; font-size: 96px; font-weight: 700; letter-spacing: -5px; fill: #111827; }
      .wordMono { font-family: 'Courier New', monospace; font-size: 82px; font-weight: 700; letter-spacing: -5px; fill: #111827; }
      .wordSoft { font-family: Arial, Helvetica, sans-serif; font-size: 92px; font-weight: 500; letter-spacing: -5px; fill: #111827; }
      .wordStack { font-family: Arial, Helvetica, sans-serif; font-size: 70px; font-weight: 800; letter-spacing: -3px; fill: #111827; }
    </style>
  </defs>

  <rect width="1800" height="3020" fill="#F6F8FC"/>
  <text x="90" y="70" class="title">OPENJOB · 10 LOGO CONCEPTS</text>
  <text x="90" y="112" class="intro">完全放开后的第一轮探索｜图标与文字一起重新设计，请从整体气质挑选方向</text>

  <!-- card 01 -->
  <g transform="translate(70 160)">
    <rect width="800" height="500" rx="34" fill="#fff"/>
    <text x="42" y="54" class="num">01</text><text x="92" y="54" class="name">APERTURE O</text><text x="42" y="88" class="note">把 Open 变成一个有出口的 O</text>
    <g transform="translate(92 155)" filter="url(#shadow)">
      <path d="M208 28 C130 -4 44 38 20 116 C-6 200 41 288 125 310 C201 330 279 287 303 219" fill="none" stroke="url(#gA)" stroke-width="50" stroke-linecap="round"/>
      <path d="M221 259 L294 186" fill="none" stroke="url(#gA)" stroke-width="50" stroke-linecap="round"/>
      <circle cx="137" cy="164" r="22" fill="#FFC477"/>
    </g>
    <text x="390" y="286" class="wordSans">OpenJob</text>
  </g>

  <!-- card 02 -->
  <g transform="translate(930 160)">
    <rect width="800" height="500" rx="34" fill="#fff"/>
    <text x="42" y="54" class="num">02</text><text x="92" y="54" class="name">OPEN PATH</text><text x="42" y="88" class="note">从入口到机会的一条连续路径</text>
    <g transform="translate(90 150)" filter="url(#shadow)">
      <path d="M36 293 C52 198 76 95 148 62 C200 39 242 69 251 122 C262 186 263 257 331 271 C390 284 431 235 455 163" fill="none" stroke="url(#gB)" stroke-width="48" stroke-linecap="round"/>
      <path d="M419 163 H455 V199" fill="none" stroke="url(#gB)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="38" cy="293" r="17" fill="#FFB95F"/>
    </g>
    <text x="390" y="286" class="wordSerif">OpenJob</text>
  </g>

  <!-- card 03 -->
  <g transform="translate(70 710)">
    <rect width="800" height="500" rx="34" fill="#fff"/>
    <text x="42" y="54" class="num">03</text><text x="92" y="54" class="name">DOORWAY J</text><text x="42" y="88" class="note">用 J 做出一扇向前打开的门</text>
    <g transform="translate(110 145)" filter="url(#shadow)">
      <path d="M70 310 V102 C70 54 108 20 157 20 H328" fill="none" stroke="url(#gC)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M328 20 H373 V65" fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round"/>
