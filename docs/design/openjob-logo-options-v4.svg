  </g>

  <!-- card 04 -->
  <g transform="translate(930 710)">
    <rect width="800" height="500" rx="34" fill="#fff"/>
    <text x="42" y="54" class="num">04</text><text x="92" y="54" class="name">AURORA WINDOW</text><text x="42" y="88" class="note">一轮光从开放的窗中升起</text>
    <g transform="translate(110 150)" filter="url(#shadow)">
      <path d="M55 305 V97 C55 52 91 20 137 20 H326" fill="none" stroke="url(#gD)" stroke-width="42" stroke-linecap="round"/>
      <path d="M326 20 H380 V74" fill="none" stroke="#fff" stroke-width="55" stroke-linecap="round"/>
      <path d="M75 305 H375" stroke="url(#gD)" stroke-width="24" stroke-linecap="round"/>
      <path d="M133 305 A105 105 0 0 1 343 305" fill="none" stroke="url(#gD)" stroke-width="28" stroke-linecap="round"/>
      <circle cx="238" cy="215" r="23" fill="#FFD06E"/>
    </g>
    <text x="390" y="286" class="wordSoft">OpenJob</text>
  </g>

  <!-- card 05 -->
  <g transform="translate(70 1260)">
    <rect width="800" height="500" rx="34" fill="#fff"/>
    <text x="42" y="54" class="num">05</text><text x="92" y="54" class="name">JOB BEACON</text><text x="42" y="88" class="note">像灯塔一样，把合适的机会照亮</text>
    <g transform="translate(118 142)" filter="url(#shadow)">
      <path d="M200 18 L286 167 L200 316 L114 167 Z" fill="none" stroke="url(#gE)" stroke-width="38" stroke-linejoin="round"/>
      <path d="M200 75 L252 167 L200 259 L148 167 Z" fill="url(#gE)" opacity=".92"/>
      <circle cx="200" cy="167" r="23" fill="#FFD27B"/>
      <path d="M56 167 H92 M308 167 H344" stroke="url(#gE)" stroke-width="22" stroke-linecap="round"/>
    </g>
    <text x="390" y="286" class="wordSerif">OpenJob</text>
  </g>

  <!-- card 06 -->
  <g transform="translate(930 1260)">
    <rect width="800" height="500" rx="34" fill="#fff"/>
    <text x="42" y="54" class="num">06</text><text x="92" y="54" class="name">SMART DIALOG</text><text x="42" y="88" class="note">求职助手的陪伴感：对话、理解、行动</text>
    <g transform="translate(95 150)" filter="url(#shadow)">
      <path d="M45 42 H311 C345 42 370 67 370 101 V231 C370 265 345 290 311 290 H170 L99 329 V290 H45 C11 290 -14 265 -14 231 V101 C-14 67 11 42 45 42Z" fill="none" stroke="url(#gF)" stroke-width="37" stroke-linejoin="round"/>
      <circle cx="102" cy="168" r="18" fill="#FFB970"/><circle cx="178" cy="168" r="18" fill="#A2E67B"/><circle cx="254" cy="168" r="18" fill="#8B7CF5"/>
    </g>
    <text x="390" y="286" class="wordSans">OpenJob</text>
  </g>

  <!-- card 07 -->
  <g transform="translate(70 1810)">
    <rect width="800" height="500" rx="34" fill="#fff"/>
    <text x="42" y="54" class="num">07</text><text x="92" y="54" class="name">LAYERED HORIZON</text><text x="42" y="88" class="note">多层信息被整理成清晰的前路</text>
    <g transform="translate(95 155)" filter="url(#shadow)">
      <path d="M36 245 H366" stroke="url(#gG)" stroke-width="28" stroke-linecap="round"/>
      <path d="M66 192 H336" stroke="url(#gG)" stroke-width="28" stroke-linecap="round" opacity=".82"/>
