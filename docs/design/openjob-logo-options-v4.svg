      <path d="M322 77 C372 110 384 177 352 229 C318 284 245 298 194 264" fill="none" stroke="url(#gI)" stroke-width="48" stroke-linecap="round"/>
      <path d="M150 180 C168 157 203 157 222 180" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
      <circle cx="78" cy="77" r="17" fill="#FFC16B"/><circle cx="322" cy="77" r="17" fill="#FFC16B"/>
    </g>
    <text x="390" y="286" class="wordSoft">OpenJob</text>
  </g>

  <!-- card 10 -->
  <g transform="translate(930 2360)">
    <rect width="800" height="500" rx="34" fill="#fff"/>
    <text x="42" y="54" class="num">10</text><text x="92" y="54" class="name">OJ FUSION</text><text x="42" y="88" class="note">把 O 和 J 合成一个更像品牌的符号</text>
    <g transform="translate(103 143)" filter="url(#shadow)">
      <path d="M199 30 C115 30 49 91 49 168 C49 246 113 306 192 306 C254 306 300 272 300 218 V146" fill="none" stroke="url(#gJ)" stroke-width="49" stroke-linecap="round"/>
      <path d="M300 62 V218 C300 271 337 306 389 306" fill="none" stroke="url(#gJ)" stroke-width="49" stroke-linecap="round"/>
      <path d="M300 62 H359" stroke="#fff" stroke-width="55" stroke-linecap="round"/>
      <circle cx="160" cy="168" r="19" fill="#FFD07A"/>
