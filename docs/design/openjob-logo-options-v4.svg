    <text x="42" y="54" class="num">08</text><text x="92" y="54" class="name">RIBBON SIGNAL</text><text x="42" y="88" class="note">一条柔韧的彩带，形成 O 与前进方向</text>
    <g transform="translate(104 140)" filter="url(#shadow)">
      <path d="M307 37 C222 -4 91 25 47 126 C9 213 57 301 153 322 C251 343 334 290 347 202 C357 139 325 91 263 71 C197 50 131 80 111 139 C90 202 123 253 182 266 C244 279 294 240 300 187" fill="none" stroke="url(#gH)" stroke-width="42" stroke-linecap="round"/>
      <path d="M300 187 L360 127" stroke="url(#gH)" stroke-width="42" stroke-linecap="round"/>
      <circle cx="182" cy="266" r="15" fill="#FFD078"/>
    </g>
    <text x="390" y="286" class="wordSerif">OpenJob</text>
  </g>

  <!-- card 09 -->
  <g transform="translate(70 2360)">
    <rect width="800" height="500" rx="34" fill="#fff"/>
    <text x="42" y="54" class="num">09</text><text x="92" y="54" class="name">HUMAN LINK</text><text x="42" y="88" class="note">人与机会相互靠近，中心留出 Open</text>
    <g transform="translate(112 148)" filter="url(#shadow)">
