<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2020" viewBox="0 0 1800 2020" role="img" aria-labelledby="title desc">
<title id="title">OpenJob final logo candidates</title><desc id="desc">Four polished OpenJob logo finalists: refined flight, open fold, north beacon, and stacked tabs, each shown as a full lockup, app icon and dark-mode lockup.</desc>
<defs>
<linearGradient id="flight" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1467F8"/><stop offset=".5" stop-color="#7257E8"/><stop offset="1" stop-color="#F47E9C"/></linearGradient>
<linearGradient id="fold" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#5138D7"/><stop offset=".52" stop-color="#AB52DE"/><stop offset="1" stop-color="#FFAA67"/></linearGradient>
<linearGradient id="beacon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0687C"/><stop offset=".5" stop-color="#C04ED0"/><stop offset="1" stop-color="#5D69F6"/></linearGradient>
<linearGradient id="tabs" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00A89D"/><stop offset=".5" stop-color="#338AF5"/><stop offset="1" stop-color="#F8B052"/></linearGradient>
<filter id="sh" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#17233E" flood-opacity=".14"/></filter>
<style>.h{font-family:Arial,sans-serif;font-size:27px;font-weight:800;letter-spacing:2px;fill:#64748B}.i{font-family:Arial,sans-serif;font-size:22px;fill:#94A3B8}.tag{font-family:Arial,sans-serif;font-size:17px;font-weight:800;letter-spacing:1.4px;fill:#64748B}.desc{font-family:Arial,sans-serif;font-size:18px;fill:#94A3B8}.sans{font-family:Arial,sans-serif;font-size:87px;font-weight:750;letter-spacing:-4px;fill:#101828}.serif{font-family:Georgia,serif;font-size:91px;font-weight:700;letter-spacing:-5px;fill:#101828}.soft{font-family:Arial,sans-serif;font-size:87px;font-weight:500;letter-spacing:-5px;fill:#101828}.mono{font-family:'Courier New',monospace;font-size:75px;font-weight:700;letter-spacing:-5px;fill:#101828}.dark{font-family:Arial,sans-serif;font-size:51px;font-weight:750;letter-spacing:-2px;fill:#fff}.caption{font-family:Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:1.2px;fill:#94A3B8}</style>
</defs>
<rect width="1800" height="2020" fill="#F5F7FB"/>
<text x="90" y="68" class="h">OPENJOB · FOUR FINALISTS</text>
<text x="90" y="108" class="i">按你选出的 01A、03A、05B、07A 再收敛：这页展示的是接近正式品牌交付的比例、细节与使用场景。</text>

<!-- A Flight -->
<g transform="translate(70 150)"><rect width="1660" height="400" rx="34" fill="#fff"/><text x="46" y="56" class="tag">A · FLIGHT MARK</text><text x="46" y="88" class="desc">最有行动感，也最容易被记住；适合“帮你主动寻找与投递机会”的产品定位。</text>
<g transform="translate(96 128)scale(.44)" filter="url(#sh)"><path d="M28 188 374 33Q393 26 389 50L247 340Q242 352 224 338L176 220 39 205Q17 195 28 188Z" fill="url(#flight)"/><path d="M28 188 176 220 389 50M176 220 224 338 247 340 244 211" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" opacity=".94"/><circle cx="176" cy="220" r="13" fill="#FFD176"/></g><text x="430" y="257" class="sans">OpenJob</text>
<text x="1115" y="122" class="caption">APP ICON</text><rect x="1115" y="140" width="128" height="128" rx="34" fill="#F2F5FF"/><g transform="translate(1131 156)scale(.26)"><path d="M28 188 374 33Q393 26 389 50L247 340Q242 352 224 338L176 220 39 205Q17 195 28 188Z" fill="url(#flight)"/><path d="M28 188 176 220 389 50M176 220 224 338 247 340 244 211" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1330" y="122" class="caption">DARK MODE</text><rect x="1330" y="140" width="270" height="128" rx="28" fill="#171D33"/><g transform="translate(1350 163)scale(.17)"><path d="M28 188 374 33Q393 26 389 50L247 340Q242 352 224 338L176 220 39 205Q17 195 28 188Z" fill="url(#flight)"/><path d="M28 188 176 220 389 50M176 220 224 338 247 340 244 211" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1430" y="220" class="dark">OpenJob</text></g>

<!-- B Fold -->
<g transform="translate(70 590)"><rect width="1660" height="400" rx="34" fill="#fff"/><text x="46" y="56" class="tag">B · OPEN FOLD</text><text x="46" y="88" class="desc">最有“打开新页面”的含义；视觉优雅，适合偏专业、可信赖的品牌气质。</text>
<g transform="translate(98 123)scale(.45)" filter="url(#sh)"><path d="M47 72 202 30V322L47 278Z" fill="url(#fold)"/><path d="M357 72 202 30V322L357 278Z" fill="url(#fold)"/><path d="M47 72 202 131 357 72M202 131V322" fill="none" stroke="#fff" stroke-width="17" stroke-linejoin="round" opacity=".87"/><circle cx="202" cy="131" r="14" fill="#FFD27A"/></g><text x="430" y="257" class="soft">OpenJob</text>
<text x="1115" y="122" class="caption">APP ICON</text><rect x="1115" y="140" width="128" height="128" rx="34" fill="#F8F4FF"/><g transform="translate(1130 154)scale(.27)"><path d="M47 72 202 30V322L47 278Z" fill="url(#fold)"/><path d="M357 72 202 30V322L357 278Z" fill="url(#fold)"/><path d="M47 72 202 131 357 72M202 131V322" fill="none" stroke="#fff" stroke-width="17" stroke-linejoin="round"/></g>
<text x="1330" y="122" class="caption">DARK MODE</text><rect x="1330" y="140" width="270" height="128" rx="28" fill="#171D33"/><g transform="translate(1350 163)scale(.18)"><path d="M47 72 202 30V322L47 278Z" fill="url(#fold)"/><path d="M357 72 202 30V322L357 278Z" fill="url(#fold)"/><path d="M47 72 202 131 357 72M202 131V322" fill="none" stroke="#fff" stroke-width="17" stroke-linejoin="round"/></g><text x="1430" y="220" class="dark">OpenJob</text></g>

<!-- C Beacon -->
<g transform="translate(70 1030)"><rect width="1660" height="400" rx="34" fill="#fff"/><text x="46" y="56" class="tag">C · NORTH BEACON</text><text x="46" y="88" class="desc">最像独立品牌符号：紧凑、适合头像与 GitHub，表达求职路上的“方向与定位”。</text>
<g transform="translate(100 123)scale(.45)" filter="url(#sh)"><path d="M201 28 351 171 201 314 51 171Z" fill="url(#beacon)"/><path d="M201 80 227 145 292 171 227 197 201 262 175 197 110 171 175 145Z" fill="#fff"/><circle cx="201" cy="171" r="13" fill="#FFD277"/></g><text x="430" y="257" class="serif">OpenJob</text>
<text x="1115" y="122" class="caption">APP ICON</text><rect x="1115" y="140" width="128" height="128" rx="34" fill="#FBF3FF"/><g transform="translate(1129 153)scale(.28)"><path d="M201 28 351 171 201 314 51 171Z" fill="url(#beacon)"/><path d="M201 80 227 145 292 171 227 197 201 262 175 197 110 171 175 145Z" fill="#fff"/></g>
<text x="1330" y="122" class="caption">DARK MODE</text><rect x="1330" y="140" width="270" height="128" rx="28" fill="#171D33"/><g transform="translate(1352 162)scale(.19)"><path d="M201 28 351 171 201 314 51 171Z" fill="url(#beacon)"/><path d="M201 80 227 145 292 171 227 197 201 262 175 197 110 171 175 145Z" fill="#fff"/></g><text x="1430" y="220" class="dark">OpenJob</text></g>

<!-- D Tabs -->
<g transform="translate(70 1470)"><rect width="1660" height="400" rx="34" fill="#fff"/><text x="46" y="56" class="tag">D · STACKED TABS</text><text x="46" y="88" class="desc">与 OpenJob 的“岗位搜索、信息整理、智能助手”最直接相关，产品感与专业感最强。</text>
<g transform="translate(100 123)scale(.45)" filter="url(#sh)"><rect x="53" y="104" width="222" height="205" rx="33" fill="none" stroke="url(#tabs)" stroke-width="34"/><rect x="126" y="45" width="222" height="205" rx="33" fill="#fff" stroke="url(#tabs)" stroke-width="34"/><path d="M169 116H300M169 163H252" stroke="url(#tabs)" stroke-width="22" stroke-linecap="round"/><circle cx="300" cy="116" r="12" fill="#FFCF73"/></g><text x="430" y="257" class="mono">OpenJob</text>
<text x="1115" y="122" class="caption">APP ICON</text><rect x="1115" y="140" width="128" height="128" rx="34" fill="#F1FAFA"/><g transform="translate(1128 154)scale(.28)"><rect x="53" y="104" width="222" height="205" rx="33" fill="none" stroke="url(#tabs)" stroke-width="34"/><rect x="126" y="45" width="222" height="205" rx="33" fill="#fff" stroke="url(#tabs)" stroke-width="34"/><path d="M169 116H300M169 163H252" stroke="url(#tabs)" stroke-width="22" stroke-linecap="round"/></g>
<text x="1330" y="122" class="caption">DARK MODE</text><rect x="1330" y="140" width="270" height="128" rx="28" fill="#171D33"/><g transform="translate(1350 163)scale(.19)"><rect x="53" y="104" width="222" height="205" rx="33" fill="none" stroke="url(#tabs)" stroke-width="34"/><rect x="126" y="45" width="222" height="205" rx="none" fill="#171D33" stroke="url(#tabs)" stroke-width="34"/><path d="M169 116H300M169 163H252" stroke="url(#tabs)" stroke-width="22" stroke-linecap="round"/></g><text x="1430" y="220" class="dark">OpenJob</text></g>
<text x="90" y="1965" class="i">请从 A、B、C、D 中选出最想作为 OpenJob 主标志的一个；选定后我会导出正式 SVG、透明 PNG、favicon 和深色版。</text>
</svg>
