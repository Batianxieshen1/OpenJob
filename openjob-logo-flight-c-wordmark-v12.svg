<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
<title id="title">OpenJob Flight Signature with Fold O wordmark</title><desc id="desc">A refined OpenJob logo that combines the Flight Signature icon with the selected Fold O style wordmark.</desc>
<defs>
<linearGradient id="flight" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1467F8"/><stop offset=".5" stop-color="#7257E8"/><stop offset="1" stop-color="#F47E9C"/></linearGradient>
<linearGradient id="word" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5B35D8"/><stop offset=".5" stop-color="#B552E0"/><stop offset="1" stop-color="#FFA968"/></linearGradient>
<filter id="sh" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17233E" flood-opacity=".14"/></filter>
<style>.h{font-family:Arial,sans-serif;font-size:27px;font-weight:800;letter-spacing:2px;fill:#64748B}.i{font-family:Arial,sans-serif;font-size:22px;fill:#94A3B8}.label{font-family:Arial,sans-serif;font-size:16px;font-weight:800;letter-spacing:1.4px;fill:#64748B}.word{font-family:Arial,sans-serif;font-size:115px;font-weight:700;letter-spacing:-5px;fill:#101828}.dark{font-family:Arial,sans-serif;font-size:61px;font-weight:700;letter-spacing:-3px;fill:#fff}.tiny{font-family:Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:1.3px;fill:#94A3B8}</style>
</defs>
<rect width="1800" height="1080" fill="#F5F7FB"/>
<text x="90" y="68" class="h">OPENJOB · FLIGHT ICON + C WORDMARK</text><text x="90" y="108" class="i">纸飞机采用 A 的图标，文字采用 C 的现代字标结构：Open 保持沉稳，Job 用渐变形成品牌重点。</text>
<rect x="70" y="150" width="1660" height="410" rx="38" fill="#fff"/>
<text x="112" y="207" class="label">PRIMARY HORIZONTAL LOGO</text>
<g transform="translate(130 255)scale(.55)" filter="url(#sh)"><path d="M28 188 374 33Q393 26 389 50L247 340Q242 352 224 338L176 220 39 205Q17 195 28 188Z" fill="url(#flight)"/><path d="M28 188 176 220 389 50M176 220 224 338 247 340 244 211" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" opacity=".94"/><path d="M176 220 244 211" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" opacity=".58"/><circle cx="176" cy="220" r="13" fill="#FFD176"/></g>
<text x="545" y="400" class="word">Open<tspan fill="url(#word)">Job</tspan></text><path d="M551 430H972" stroke="#EEE8F5" stroke-width="7" stroke-linecap="round"/>
<text x="1130" y="220" class="tiny">图标与文字视觉高度已对齐</text><text x="1130" y="254" class="tiny">适合网站导航、宣传与 GitHub 项目页</text>
<rect x="70" y="610" width="800" height="350" rx="38" fill="#fff"/><text x="112" y="668" class="label">APP / GITHUB ICON</text><rect x="116" y="705" width="190" height="190" rx="53" fill="#F2F5FF"/><g transform="translate(140 729)scale(.39)"><path d="M28 188 374 33Q393 26 389 50L247 340Q242 352 224 338L176 220 39 205Q17 195 28 188Z" fill="url(#flight)"/><path d="M28 188 176 220 389 50M176 220 224 338 247 340 244 211" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g><text x="372" y="794" class="word" font-size="75">Open<tspan fill="url(#word)">Job</tspan></text><text x="374" y="842" class="tiny">小尺寸时，仅使用纸飞机图标即可</text>
<rect x="930" y="610" width="800" height="350" rx="38" fill="#171D33"/><text x="972" y="668" class="label" fill="#8C98AC">DARK BACKGROUND</text><g transform="translate(985 731)scale(.31)"><path d="M28 188 374 33Q393 26 389 50L247 340Q242 352 224 338L176 220 39 205Q17 195 28 188Z" fill="url(#flight)"/><path d="M28 188 176 220 389 50M176 220 224 338 247 340 244 211" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1240" y="820" class="dark">Open<tspan fill="url(#word)">Job</tspan></text><path d="M1243 844H1538" stroke="#364058" stroke-width="5" stroke-linecap="round"/>
<text x="90" y="1035" class="i">如果这版确认，我下一步会制作正式的文件套件：横版 SVG、仅图标 SVG、透明 PNG（多尺寸）和 favicon。</text>
</svg>
